# Informational (non-gating) job: build + run the integration tests against the
# latest Apache Maven 4.0.0-SNAPSHOT distribution, resolved dynamically from the
# Apache snapshots repository (the shared maven-verify workflow cannot point the
# maven-wrapper at a SNAPSHOT distribution). The SNAPSHOT moves daily, so treat
# the result as a signal, not a merge gate.
name: Verify against Maven 4.0.0-SNAPSHOT

on: [push, pull_request]

jobs:
  verify-maven4-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'
      - name: Install latest Maven 4.0.0-SNAPSHOT distribution
        run: |
          set -euo pipefail
          BASE=https://repository.apache.org/content/repositories/snapshots/org/apache/maven/apache-maven/4.0.0-SNAPSHOT
          V=$(curl -fsSL "$BASE/maven-metadata.xml" \
              | grep -m1 -A4 '<classifier>bin</classifier>' \
              | grep -m1 -oE '<value>[^<]+</value>' | sed 's/<[^>]*>//g')
          echo "Resolved snapshot build: $V"
          curl -fsSL -o /tmp/m4.zip "$BASE/apache-maven-$V-bin.zip"
          unzip -q /tmp/m4.zip -d /tmp/m4
          echo "/tmp/m4/apache-maven-4.0.0-SNAPSHOT/bin" >> "$GITHUB_PATH"
      - run: mvn -v
      - name: Build + run ITs against 4.0.0-SNAPSHOT
        run: mvn -B -P run-its clean verify --no-transfer-progress
